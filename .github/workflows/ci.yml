name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: pytest
  edge:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/edge}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: pytest
  eufy-edge:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/eufy-edge}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pytest ruff pyyaml
      - run: ruff check .
      - run: pytest
  eufy-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg BUILD_ARCH=amd64 -t homecam-eufy-edge:ci homecam-eufy-edge
      - name: Smoke-test the add-on without any Eufy bridge or credentials
        run: |
          mkdir -p /tmp/addon-data
          printf '%s' '{"eufy_ws_url":"ws://127.0.0.1:3000","home_cam_eufy_token":"ci-only-token","stream_base_url":"http://127.0.0.1:8091","port":8091,"live_idle_stop_seconds":60}' > /tmp/addon-data/options.json
          docker run -d --name eufy-addon --network host -v /tmp/addon-data:/data:ro homecam-eufy-edge:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8091/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8091/healthz
          # Bearer auth enforced; bad HLS tokens and the loopback-only ingest stay closed.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8091/devices)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8091/hls/wrong/eufy-X/stream.m3u8)" = 404
          # Bundled go2rtc answers on loopback only, with WebRTC/SRTP not loaded,
          # and stays off Home Assistant Core's go2rtc ports (11984/18554/18555).
          curl -fsS http://127.0.0.1:21984/api >/dev/null
          if curl -fsS --max-time 2 http://127.0.0.1:1984/api; then echo "default go2rtc API is open" >&2; exit 1; fi
          if ss -lntu | grep -E ':(8555|8443|8554|1984|11984|18554|18555)\b'; then echo "shared host port taken" >&2; exit 1; fi
          ss -lnt | grep -E '127\.0\.0\.1:21984\b'
          ss -lnt | grep -E '127\.0\.0\.1:28554\b'
          docker logs eufy-addon > /tmp/addon.log 2>&1
          cat /tmp/addon.log
          if grep -F ci-only-token /tmp/addon.log; then echo "token leaked to logs" >&2; exit 1; fi
          docker rm -f eufy-addon
      - name: Refuse to start when the private go2rtc port is already taken
        run: |
          python3 -m http.server 21984 --bind 127.0.0.1 >/dev/null 2>&1 &
          squatter=$!
          sleep 1
          if docker run --rm --network host -v /tmp/addon-data:/data:ro homecam-eufy-edge:ci > /tmp/busy.log 2>&1; then
            echo "add-on started next to another server on 21984" >&2; exit 1
          fi
          cat /tmp/busy.log
          grep -F "127.0.0.1:21984 is already in use" /tmp/busy.log
          if grep -F "Uvicorn running" /tmp/busy.log; then exit 1; fi
          kill "$squatter"
  docker-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config
      - run: docker compose build api web
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
